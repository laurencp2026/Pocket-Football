<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#11162d">
<title>Pocket Football — Turbo Cup</title>
<style>
:root {
  --bg:#11162d; --lime:#d9ff55; --cyan:#55edff;
  --pink:#ff568d; --white:#f7f8ff;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent }
html,body { margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--white);font-family:system-ui,-apple-system,sans-serif }
body { display:flex;justify-content:center }
#app { position:relative;width:100%;height:100%;max-width:560px;overflow:hidden;background:var(--bg);isolation:isolate }
canvas { position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block }
#hud { position:absolute;z-index:2;left:0;right:0;top:0;padding:env(safe-area-inset-top,8px) 13px 12px;background:linear-gradient(#11162df5,#11162d00);pointer-events:none }
.hudtop { display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;font-weight:900 }
.brand { color:var(--lime);letter-spacing:2px;font-size:11px;font-weight:1000 }
#playerLabel { max-width:35%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap }
#clock { font-size:23px;font-weight:1000;font-variant-numeric:tabular-nums }
.score { display:flex;align-items:center;justify-content:center;gap:17px;font-size:35px;line-height:1.2;font-weight:1000;letter-spacing:3px }
.teamname { font-size:9px;letter-spacing:1px;font-weight:1000 }
.homeLabel { color:var(--cyan) }.awayLabel { color:var(--pink) }
#phase { text-align:center;color:var(--lime);font-size:10px;font-weight:900;letter-spacing:2px }
#controls { position:absolute;z-index:3;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;justify-content:center;gap:8px;padding:0 7px;pointer-events:none }
.action { pointer-events:auto;flex:1;max-width:125px;min-width:0;padding:13px 5px;border:1px solid #ffffff50;border-radius:13px;background:#11162ded;color:white;font-size:11px;font-weight:1000;box-shadow:0 4px 0 #080b18;touch-action:manipulation }
.action.shoot { background:var(--lime);color:var(--bg);border-color:var(--lime) }
.action:active,.primary:active { transform:scale(.96) }
#hint { position:absolute;z-index:2;bottom:calc(env(safe-area-inset-bottom,0px) + 67px);left:0;right:0;text-align:center;font-size:9px;letter-spacing:1px;font-weight:900;color:#ffffffc9;text-shadow:0 2px 5px #000;pointer-events:none }
.screen { position:absolute;inset:0;z-index:5;display:none;align-items:center;justify-content:center;flex-direction:column;padding:22px;text-align:center;background:radial-gradient(ellipse at 50% 35%,#354582,#11162d 70%);overflow:auto }
.screen.active { display:flex }
.kicker { font-size:10px;letter-spacing:3px;color:var(--cyan);font-weight:1000 }
h1 { margin:15px 0;font-size:clamp(40px,10vw,61px);line-height:.9;letter-spacing:-3px;font-weight:1000 }
h1 span { color:var(--lime) }
.hero { font-size:65px;margin:10px;filter:drop-shadow(0 8px 15px #0005);animation:bob 2s ease-in-out infinite }
@keyframes bob { 50% { transform:translateY(-8px) rotate(9deg) } }
p { color:#c8d0f0;font-size:14px;line-height:1.6;max-width:310px }
label { margin:12px 0 7px;color:#c8d0f0;font-size:11px;font-weight:900;letter-spacing:2px }
input { width:min(100%,300px);padding:14px;border-radius:12px;border:1px solid #58628e;background:#171f41;color:white;font-size:16px;text-align:center;outline:none;user-select:text }
input:focus { border-color:var(--lime) }
.primary { width:min(100%,300px);padding:15px;border:0;border-radius:13px;margin-top:13px;background:var(--lime);color:var(--bg);font-size:16px;font-weight:1000;letter-spacing:1px;box-shadow:0 5px 0 #94b52b }
.best { margin-top:19px;color:#abb7e1;font-size:11px;letter-spacing:1px;line-height:1.8 }
.best strong { display:block;color:var(--lime);font-size:20px }
#overlay { position:absolute;inset:0;z-index:4;display:none;align-items:center;justify-content:center;flex-direction:column;padding:24px;text-align:center;background:#0d1229eF;backdrop-filter:blur(5px) }
#overlay.show { display:flex }
.small { color:var(--cyan);font-size:10px;letter-spacing:3px;font-weight:1000 }
#overlay h2 { font-size:clamp(34px,9vw,48px);line-height:1;margin:12px 0;letter-spacing:-2px }
#notice { position:absolute;z-index:3;top:44%;left:50%;transform:translate(-50%,-50%);font-size:clamp(24px,7vw,36px);font-weight:1000;color:var(--lime);text-shadow:0 3px 15px #000;pointer-events:none;opacity:0;white-space:nowrap }
#notice.show { animation:pop .9s ease-out }
@keyframes pop { 15% { opacity:1;transform:translate(-50%,-50%) scale(1.15) }70% { opacity:1 }100% { opacity:0;transform:translate(-50%,-75%) } }
@media(max-height:650px) {
 h1 { font-size:38px;margin:8px }.hero { font-size:38px;margin:5px }p { margin:7px;font-size:12px }.best { margin-top:9px }.screen { padding:12px }label { margin:5px }
}
</style>
</head>
<body>
<div id="app">
  <canvas id="canvas"></canvas>

  <div id="hud" hidden>
    <div class="hudtop">
      <span class="brand">POCKET FC</span>
      <span id="playerLabel">PLAYER</span>
      <span id="clock">01:00</span>
    </div>
    <div class="score">
      <span id="us">0</span>
      <span style="color:#7b86b2">:</span>
      <span id="them">0</span>
    </div>
    <div class="hudtop" style="margin-top:-2px">
      <span class="teamname homeLabel">YOUR TEAM</span>
      <span class="teamname awayLabel">RIVALS</span>
    </div>
    <div id="phase">FIRST HALF</div>
  </div>

  <div id="hint" hidden>TAP TO MOVE · WIN THE BALL · SHOOT BUTTON TO SHOOT</div>
  <div id="controls" hidden>
    <button class="action" id="pass">↗ PASS</button>
    <button class="action shoot" id="shoot">⚡ SHOOT</button>
    <button class="action" id="switch">⇄ SWITCH</button>
  </div>
  <div id="notice"></div>

  <section class="screen active" id="title">
    <div class="kicker">ARCADE FOOTBALL · SEASON 01</div>
    <h1>POCKET<br><span>FOOTBALL</span></h1>
    <div class="hero">⚽</div>
    <p>One minute. Two goals. One legend.<br>Beat the rivals. Defend your goal.</p>
    <label for="name">YOUR FIRST NAME</label>
    <input id="name" maxlength="18" placeholder="Enter your name" autocomplete="given-name">
    <button class="primary" id="play">▶ KICK OFF</button>
    <div class="best">PERSONAL BEST<strong id="best">0 goals</strong></div>
  </section>

  <div id="overlay">
    <div class="small" id="overLabel">HALF TIME</div>
    <h2 id="overTitle">CHANGE ENDS!</h2>
    <p id="overText"></p>
    <button class="primary" id="overButton">▶ SECOND HALF</button>
  </div>
</div>

<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);
const canvas = $("canvas");
const ctx = canvas.getContext("2d");

const C = {
  grass:"#177653", stripe:"#ffffff0b", line:"#ffffffb5",
  cyan:"#55edff", pink:"#ff568d", lime:"#d9ff55",
  skin:"#dca47c", ink:"#11162d"
};

let W=0,H=0,DPR=1;
let state="title", raf=0,last=0;
let name="PLAYER",time=60,half=false;
let home=0,away=0,selected=0,difficulty=1;
let players=[],ball=null,particles=[],swipe=null;
let audio=null,lastAIShoot=-10000,lastGoal=0,goalLock=false;
let noticeTimer=0;

function sound(freq=440,duration=.1,type="sine",volume=.04) {
  if(!audio)return;
  try {
    const o=audio.createOscillator(),g=audio.createGain();
    o.type=type;
    o.frequency.setValueAtTime(freq,audio.currentTime);
    g.gain.setValueAtTime(volume,audio.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);
    o.connect(g);g.connect(audio.destination);
    o.start();o.stop(audio.currentTime+duration);
  } catch(e){}
}
function enableSound() {
  if(!audio) {
    try { audio=new(window.AudioContext||window.webkitAudioContext)(); }
    catch(e){}
  }
  if(audio&&audio.state==="suspended")audio.resume();
}
function kickSound(){sound(155,.09,"triangle",.07)}
function goalSound(){
  sound(440,.13);setTimeout(()=>sound(660,.15),110);
  setTimeout(()=>sound(880,.22),220);
}
function bestRead() {
  try{return Number(localStorage.getItem("pocket-football-best")||0)}
  catch(e){return 0}
}
function bestShow(){$("best").textContent=bestRead()+" goals"}

function field() {
  const top=Math.max(112,H*.18);
  const bottom=H-Math.max(92,H*.15);
  const left=Math.max(19,W*.055),right=W-left;
  return {top,bottom,left,right,cx:(left+right)/2,cy:(top+bottom)/2};
}
function resize() {
  const r=$("app").getBoundingClientRect();
  W=r.width;H=r.height;
  DPR=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(W*DPR);
  canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  if(players.length&&ball)draw();
}
window.addEventListener("resize",resize);

function makePlayer(team,user,x,y,n) {
  return {
    team,user,n,x,y,vx:0,vy:0,
    r:user?12.5:11.5,
    speed:W*(user?.55:.34),
    tx:x,ty:y,face:team==="home"?0:Math.PI,
    kick:0,stamina:1,
    hair:n%3,skinTone:["#f1c59d","#c98b64","#8d563c","#e1ad83"][n%4]
  };
}

function setupPlayers() {
  const f=field();
  players=[
    makePlayer("home",true,f.cx-W*.13,f.cy-24,0),
    makePlayer("home",true,f.cx-W*.13,f.cy+34,1),
    makePlayer("home",false,f.cx-W*.28,f.cy-65,2),
    makePlayer("home",false,f.cx-W*.28,f.cy+65,3),
    makePlayer("away",false,f.cx+W*.28,f.cy-65,0),
    makePlayer("away",false,f.cx+W*.28,f.cy+65,1),
    makePlayer("away",false,f.cx+W*.20,f.cy,2),
    makePlayer("away",false,f.cx+W*.38,f.cy+30,3),
    {...makePlayer("home",false,f.left+W*.035,f.cy,4),keeper:true},
    {...makePlayer("away",false,f.right-W*.035,f.cy,5),keeper:true}
  ];
  ball={x:f.cx,y:f.cy,vx:0,vy:0,r:Math.max(5,W*.013),owner:-1,spin:0};
  selected=0;particles=[];
  resetKickoff();
}

function resetKickoff() {
  const f=field();
  players.forEach(p=>{
    if(p.user) {
      const i=players.filter(q=>q.user).indexOf(p);
      p.x=f.cx-W*.13;
      p.y=f.cy+(i===0?-25:30);
    } else {
      p.x=f.cx+(p.team==="home"?-1:1)*W*.27;
      p.y=f.cy+(p.n%3-1)*Math.min(65,H*.11);
    }
    p.vx=0;p.vy=0;p.tx=p.x;p.ty=p.y;
    p.face=p.team==="home"?0:Math.PI;
  });
  ball.x=f.cx;ball.y=f.cy;ball.vx=0;ball.vy=0;ball.owner=-1;
}

function selectedPlayer() {
  return players.filter(p=>p.user)[selected%2];
}
function startGame() {
  enableSound();
  name=($("name").value.trim()||"PLAYER").slice(0,18);
  $("playerLabel").textContent=name.toUpperCase();
  home=0;away=0;time=60;half=false;difficulty=1;
  goalLock=false;
  $("hud").hidden=false;$("controls").hidden=false;$("hint").hidden=false;
  $("title").classList.remove("active");
  $("overlay").classList.remove("show");
  setupPlayers();
  state="playing";
  updateHUD();sound(950,.18);
  last=performance.now();
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(loop);
}
function updateHUD() {
  $("us").textContent=home;
  $("them").textContent=away;
  $("clock").textContent="00:"+String(Math.ceil(time)).padStart(2,"0");
  $("clock").style.color=time<=10?C.pink:"white";
  $("phase").textContent=half?"SECOND HALF":"FIRST HALF";
}
function announce(text) {
  const n=$("notice");
  n.textContent=text;n.classList.remove("show");
  void n.offsetWidth;n.classList.add("show");
  clearTimeout(noticeTimer);
  noticeTimer=setTimeout(()=>n.classList.remove("show"),950);
}
function showOverlay(label,title,text,button,fn) {
  $("overLabel").textContent=label;
  $("overTitle").textContent=title;
  $("overText").textContent=text;
  $("overButton").textContent=button;
  $("overButton").onclick=fn;
  $("overlay").classList.add("show");
}
function halftime() {
  state="half";sound(1050,.22);
  showOverlay("HALF TIME","CHANGE ENDS!",
    `${name}: ${home} – ${away}. The rivals will come back stronger.`,
    "▶ SECOND HALF",()=>{
      $("overlay").classList.remove("show");
      half=true;state="playing";
      resetKickoff();updateHUD();
      last=performance.now();raf=requestAnimationFrame(loop);
    });
}
function finish() {
  state="over";sound(750,.25);
  try {
    if(home>bestRead())localStorage.setItem("pocket-football-best",String(home));
  }catch(e){}
  bestShow();
  const title=home>away?"YOU WIN!":home<away?"FULL TIME!":"IT'S A DRAW!";
  const text=home>away?`Brilliant, ${name}! You win ${home}–${away}.`
    :home<away?`The rivals win ${away}–${home}. Can you beat them next time?`
    :`All square at ${home}–${away}. Play again to settle it!`;
  showOverlay("FULL TIME",title,text,"↻ PLAY AGAIN",startGame);
}

function clampPlayer(p) {
  const f=field();
  p.x=Math.max(f.left+p.r,Math.min(f.right-p.r,p.x));
  p.y=Math.max(f.top+p.r,Math.min(f.bottom-p.r,p.y));
}
function moveTo(p,x,y,dt,speed) {
  const dx=x-p.x,dy=y-p.y,d=Math.hypot(dx,dy);
  if(d>1) {
    const v=Math.min(speed,d*7);
    p.vx+=(dx/d*v-p.vx)*Math.min(1,dt*9);
    p.vy+=(dy/d*v-p.vy)*Math.min(1,dt*9);
  } else {
    p.vx*=Math.max(0,1-dt*8);
    p.vy*=Math.max(0,1-dt*8);
  }
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  if(Math.hypot(p.vx,p.vy)>4)p.face=Math.atan2(p.vy,p.vx);
  clampPlayer(p);
}

function kickToward(x,y,speed) {
  const dx=x-ball.x,dy=y-ball.y,n=Math.hypot(dx,dy)||1;
  ball.owner=-1;
  ball.vx=dx/n*speed;
  ball.vy=dy/n*speed;
}

function act(kind,angle=null,power=1) {
  if(state!=="playing"||goalLock)return;
  enableSound();
  const p=selectedPlayer();
  if(!p)return;

  if(kind==="switch") {
    selected=(selected+1)%2;
    sound(510,.06);return;
  }

  const distance=Math.hypot(p.x-ball.x,p.y-ball.y);
  const ownsBall=ball.owner===players.indexOf(p);
  if((kind==="shoot"||kind==="pass")&&!ownsBall) {
    p.tx=ball.x;p.ty=ball.y;
    announce("WIN THE BALL FIRST!");
    return;
  }
  if(distance>p.r+ball.r+35&&!ownsBall) {
    if(kind==="move"&&angle!==null) {
      p.tx=p.x+Math.cos(angle)*W*.22;
      p.ty=p.y+Math.sin(angle)*W*.22;
    } else {
      p.tx=ball.x;p.ty=ball.y;
    }
    return;
  }

  if(kind==="move"&&angle!==null) {
    p.tx=p.x+Math.cos(angle)*W*.22;
    p.ty=p.y+Math.sin(angle)*W*.22;
    clampTarget(p);return;
  }

  if(kind==="pass") {
    let mate=null,best=-Infinity;
    const dx=angle===null?1:Math.cos(angle);
    const dy=angle===null?0:Math.sin(angle);
    players.forEach(q=>{
      if(q.team!=="home"||q.user)return;
      const vx=q.x-ball.x,vy=q.y-ball.y;
      const rank=vx*dx+vy*dy-Math.hypot(vx,vy)*.12;
      if(rank>best){best=rank;mate=q}
    });
    if(mate)kickToward(mate.x,mate.y,W*.95);
    else kickToward(field().right,field().cy,W*.9);
    p.kick=.3;kickSound();return;
  }

  if(kind==="shoot") {
    const f=field();
    if(angle!==null) {
      kickToward(ball.x+Math.cos(angle)*W,ball.y+Math.sin(angle)*W,
        W*(1.08+.2*power));
    } else {
      kickToward(f.right+25,f.cy+(f.cy-ball.y)*.45,W*1.18);
    }
    p.kick=.32;kickSound();
  }
}
function clampTarget(p) {
  const f=field();
  p.tx=Math.max(f.left,Math.min(f.right,p.tx));
  p.ty=Math.max(f.top,Math.min(f.bottom,p.ty));
}

function scoreGoal(team) {
  if(state!=="playing"||goalLock)return;
  goalLock=true;
  if(team==="home")home+=1;else away+=1;
  goalSound();
  announce(team==="home"?"GOAL!  +1":"RIVALS SCORE!  +1");
  for(let i=0;i<28;i++) {
    const a=Math.random()*Math.PI*2,s=45+Math.random()*160;
    particles.push({
      x:ball.x,y:ball.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
      life:.8+Math.random()*.5,color:team==="home"?C.lime:C.pink
    });
  }
  updateHUD();
  ball.owner=-1;ball.vx=0;ball.vy=0;
  setTimeout(()=>{
    if(state==="playing") {
      resetKickoff();
      goalLock=false;
    }
  },750);
}

function update(dt) {
  if(goalLock) {
    particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});
    particles=particles.filter(p=>p.life>0);
    time=Math.max(0,time-dt);
    updateHUD();
    if(!half&&time<=30){time=30;updateHUD();halftime();return}
    if(time<=0){time=0;finish()}
    return;
  }

  time=Math.max(0,time-dt);
  difficulty=1+(60-time)/45;
  const f=field();

  let carrier=ball.owner>=0?players[ball.owner]:null;

  // Move every player and make the two teams react to the ball.
  players.forEach((p,i)=>{
    if(p.keeper) {
      const homeKeeper=p.team==="home";
      const gx=homeKeeper?f.left+W*.035:f.right-W*.035;
      const range=Math.min(76,(f.bottom-f.top)*.30)/2;
      const gy=Math.max(f.cy-range+ p.r,Math.min(f.cy+range-p.r,ball.y));
      moveTo(p,gx,gy,dt,p.speed*.72);
    } else if(p.user) {
      if(ball.owner===i) {
        // The player dribbles toward the opponents' goal.
        p.tx+=W*.12*dt;
        clampTarget(p);
      } else if(!carrier) {
        // Chase the loose ball if the player is not moving elsewhere.
        if(Math.hypot(p.tx-p.x,p.ty-p.y)<10) {
          p.tx=ball.x;p.ty=ball.y;
        }
      }
      moveTo(p,p.tx,p.ty,dt,p.speed);
    } else if(p.team==="home") {
      // Teammates provide support and help recover possession.
      let tx=p.x+(ball.x-f.cx)*.14;
      let ty=p.y+(ball.y-f.cy)*.16;
      if(carrier&&carrier.team==="away") {
        tx=ball.x-W*.025;
        ty=ball.y+(p.n%2?16:-16);
      } else if(!carrier) {
        tx=ball.x-W*.06;
        ty=ball.y+(p.n%2?24:-24);
      }
      moveTo(p,tx,ty,dt,p.speed*.83);
    } else {
      // All rivals actively close down the ball, not just stand in formation.
      let tx=ball.x+W*.025;
      let ty=ball.y+(p.n%3-1)*Math.min(23,H*.04);
      if(carrier&&carrier.team==="away") {
        tx=f.left+W*.12;
        ty=f.cy+(p.n%3-1)*28;
      }
      moveTo(p,tx,ty,dt,p.speed*difficulty);
    }
  });

  // Player possession follows the player's feet.
  if(ball.owner>=0) {
    carrier=players[ball.owner];
    ball.x=carrier.x+Math.cos(carrier.face)*carrier.r*1.2;
    ball.y=carrier.y+Math.sin(carrier.face)*carrier.r*1.2;
    ball.vx=carrier.vx*.2;
    ball.vy=carrier.vy*.2;
  } else {
    // Free ball physics.
    ball.x+=ball.vx*dt;
    ball.y+=ball.vy*dt;
    ball.vx*=Math.pow(.986,dt*60);
    ball.vy*=Math.pow(.986,dt*60);

    // Nearest footballer collects the ball when it slows down.
    if(Math.hypot(ball.vx,ball.vy)<W*.9) {
      let nearest=-1,min=Infinity;
      players.forEach((p,i)=>{
        const d=Math.hypot(p.x-ball.x,p.y-ball.y);
        if(d<min){min=d;nearest=i}
      });
      if(nearest>=0&&min<players[nearest].r+ball.r+7) {
        ball.owner=nearest;
      }
    }
  }

  carrier=ball.owner>=0?players[ball.owner]:null;

  // Tackling: rivals attempt to steal the ball from nearby home players.
  if(carrier&&carrier.team==="home") {
    for(let i=0;i<players.length;i++) {
      const opponent=players[i];
      if(opponent.team!=="away")continue;
      const d=Math.hypot(opponent.x-carrier.x,opponent.y-carrier.y);
      if(d<opponent.r+carrier.r+4&&Math.random()<dt*(1.25+.25*difficulty)) {
        ball.owner=i;
        carrier=opponent;
        sound(120,.06,"triangle",.035);
        announce("TACKLED!");
        break;
      }
    }
  }

  carrier=ball.owner>=0?players[ball.owner]:null;

  // Opposition attacks, passes, and shoots at YOUR goal on the left.
  if(carrier&&carrier.team==="away") {
    const rivals=players.filter(p=>p.team==="away");
    carrier.tx=f.left+W*.11;
    carrier.ty=f.cy+(carrier.y-f.cy)*.35;

    const nearGoal=carrier.x<f.left+W*.22;
    const shotReady=performance.now()-lastAIShoot>2400;

    if(nearGoal&&shotReady) {
      lastAIShoot=performance.now();
      const aimY=f.cy+(f.cy-carrier.y)*.30+(Math.random()-.5)*Math.min(52,H*.10);
      kickToward(f.left-25,aimY,W*(.78+.10*difficulty));
      kickSound();
      announce("RIVALS SHOOT!");
    } else if(Math.random()<dt*.10*difficulty) {
      // An occasional pass makes their attacks less predictable.
      const teammate=rivals.find(q=>q!==carrier&&q.x<carrier.x-W*.035);
      if(teammate) {
        kickToward(teammate.x,teammate.y,W*.75);
        kickSound();
      }
    }
  }

  // A loose ball can be recovered immediately after a challenge.
  if(ball.owner<0&&Math.hypot(ball.vx,ball.vy)<W*.55) {
    let nearest=-1,min=Infinity;
    players.forEach((p,i)=>{
      const d=Math.hypot(p.x-ball.x,p.y-ball.y);
      if(d<min){min=d;nearest=i}
    });
    if(nearest>=0&&min<players[nearest].r+ball.r+5)ball.owner=nearest;
  }

  // Goalkeepers can block shots before they cross the line.
  const gh=Math.min(76,(f.bottom-f.top)*.30);
  if(ball.owner<0 && Math.abs(ball.y-f.cy)<gh/2+ball.r) {
    const homeKeeper=players.find(p=>p.keeper&&p.team==="home");
    const awayKeeper=players.find(p=>p.keeper&&p.team==="away");
    if(ball.vx<0 && ball.x<f.left+W*.075 && homeKeeper &&
       Math.abs(ball.y-homeKeeper.y)<homeKeeper.r+ball.r+8) {
      ball.x=f.left+W*.075;ball.vx=Math.abs(ball.vx)*.72;ball.vy+=(Math.random()-.5)*W*.35;
      announce("SAVE!");
    } else if(ball.vx>0 && ball.x>f.right-W*.075 && awayKeeper &&
       Math.abs(ball.y-awayKeeper.y)<awayKeeper.r+ball.r+8) {
      ball.x=f.right-W*.075;ball.vx=-Math.abs(ball.vx)*.72;ball.vy+=(Math.random()-.5)*W*.35;
      announce("SAVE!");
    }
  }
  if(ball.y<f.top+ball.r){ball.y=f.top+ball.r;ball.vy=Math.abs(ball.vy)*.8}
  if(ball.y>f.bottom-ball.r){ball.y=f.bottom-ball.r;ball.vy=-Math.abs(ball.vy)*.8}

  if(ball.x<f.left+ball.r) {
    if(Math.abs(ball.y-f.cy)<gh/2)scoreGoal("away");
    else{ball.x=f.left+ball.r;ball.vx=Math.abs(ball.vx)*.8}
  }
  if(ball.x>f.right-ball.r) {
    if(Math.abs(ball.y-f.cy)<gh/2)scoreGoal("home");
    else{ball.x=f.right-ball.r;ball.vx=-Math.abs(ball.vx)*.8}
  }

  ball.spin+=Math.hypot(ball.vx,ball.vy)*dt*.03;
  particles.forEach(p=>{
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.vx*=.97;p.vy*=.97;p.life-=dt;
  });
  particles=particles.filter(p=>p.life>0);
  updateHUD();

  if(!half&&time<=30) {
    time=30;updateHUD();halftime();return;
  }
  if(time<=0){time=0;finish()}
}

// Draw the pitch.
function drawField() {
  const f=field(),w=f.right-f.left,h=f.bottom-f.top;
  ctx.fillStyle="#11162d";
  ctx.fillRect(0,0,W,H);

  // Stadium seating and tiny crowd lights.
  ctx.fillStyle="#273354";
  ctx.fillRect(0,f.top-13,W,11);
  for(let x=7;x<W;x+=19) {
    ctx.fillStyle=Math.floor(x/19)%3===0?C.pink:
      Math.floor(x/19)%3===1?C.cyan:"#fff";
    ctx.fillRect(x,f.top-11,7,4);
  }

  ctx.fillStyle=C.grass;
  ctx.fillRect(f.left,f.top,w,h);
  for(let i=0;i<10;i+=2) {
    ctx.fillStyle=C.stripe;
    ctx.fillRect(f.left+w*i/10,f.top,w/10,h);
  }

  ctx.strokeStyle=C.line;
  ctx.lineWidth=1.5;
  ctx.strokeRect(f.left,f.top,w,h);
  ctx.beginPath();
  ctx.moveTo(f.cx,f.top);ctx.lineTo(f.cx,f.bottom);ctx.stroke();
  ctx.beginPath();
  ctx.arc(f.cx,f.cy,Math.min(h*.13,w*.15),0,Math.PI*2);ctx.stroke();
  ctx.fillStyle="#fff";
  ctx.beginPath();ctx.arc(f.cx,f.cy,2.5,0,Math.PI*2);ctx.fill();

  const bw=Math.min(49,w*.17),bh=h*.38;
  ctx.strokeRect(f.left,f.cy-bh/2,bw,bh);
  ctx.strokeRect(f.right-bw,f.cy-bh/2,bw,bh);

  // Goals with nets and bright posts.
  const gh=Math.min(76,h*.30);
  ctx.fillStyle="#d9ff5524";
  ctx.fillRect(f.left-8,f.cy-gh/2,8,gh);
  ctx.fillRect(f.right,f.cy-gh/2,8,gh);
  ctx.strokeStyle="#fff";ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(f.left-5,f.cy-gh/2);ctx.lineTo(f.left-5,f.cy+gh/2);ctx.stroke();
  ctx.beginPath();ctx.moveTo(f.right+5,f.cy-gh/2);ctx.lineTo(f.right+5,f.cy+gh/2);ctx.stroke();
  ctx.strokeStyle="#ffffff4c";ctx.lineWidth=.7;
  for(let y=f.cy-gh/2+5;y<f.cy+gh/2;y+=7) {
    ctx.beginPath();ctx.moveTo(f.left-8,y);ctx.lineTo(f.left,y);ctx.stroke();
    ctx.beginPath();ctx.moveTo(f.right,y);ctx.lineTo(f.right+8,y);ctx.stroke();
  }
}

// Each player is an animated little person, drawn entirely in Canvas.
function drawPlayer(p) {
  ctx.save();
  ctx.translate(p.x,p.y);

  const homeTeam=p.team==="home";
  const kit=homeTeam?C.cyan:C.pink;
  const shorts=homeTeam?"#1476a2":"#a51e57";
  const skin=p.skinTone;
  const r=p.r;

  // Small running cycle.
  const moving=Math.hypot(p.vx,p.vy)>15;
  const stride=moving?Math.sin(performance.now()*.018+p.n*1.8)*r*.23:0;
  const swing=moving?Math.sin(performance.now()*.018+p.n*1.8):0;

  // Ground shadow.
  ctx.fillStyle="#06142c75";
  ctx.beginPath();
  ctx.ellipse(2,r*.9,r*.95,r*.34,0,0,Math.PI*2);
  ctx.fill();

  // Selection halo and pointer.
  if(p.user&&players.filter(q=>q.user).indexOf(p)===selected) {
    ctx.strokeStyle=C.lime;
    ctx.lineWidth=1.8;
    ctx.beginPath();
    ctx.ellipse(0,0,r+5,r+4,0,0,Math.PI*2);
    ctx.stroke();
    ctx.fillStyle=C.lime;
    ctx.beginPath();
    ctx.moveTo(0,-r-11);
    ctx.lineTo(-4,-r-17);
    ctx.lineTo(4,-r-17);
    ctx.closePath();
    ctx.fill();
  }

  ctx.lineCap="round";
  ctx.lineJoin="round";

  // Legs and socks.
  ctx.lineWidth=Math.max(3,r*.30);
  ctx.strokeStyle=skin;
  ctx.beginPath();
  ctx.moveTo(-r*.23,r*.24);
  ctx.lineTo(-r*.28-stride,r*.75);
  ctx.moveTo(r*.23,r*.24);
  ctx.lineTo(r*.28+stride,r*.75);
  ctx.stroke();

  ctx.strokeStyle=kit;
  ctx.lineWidth=Math.max(3,r*.24);
  ctx.beginPath();
  ctx.moveTo(-r*.28-stride,r*.57);
  ctx.lineTo(-r*.28-stride,r*.78);
  ctx.moveTo(r*.28+stride,r*.57);
  ctx.lineTo(r*.28+stride,r*.78);
  ctx.stroke();

  // Football boots.
  ctx.strokeStyle="#191827";
  ctx.lineWidth=Math.max(3,r*.27);
  ctx.beginPath();
  ctx.moveTo(-r*.28-stride,r*.78);
  ctx.lineTo(-r*.53-stride,r*.81);
  ctx.moveTo(r*.28+stride,r*.78);
  ctx.lineTo(r*.53+stride,r*.81);
  ctx.stroke();

  // Arms with a natural running swing.
  ctx.strokeStyle=skin;
  ctx.lineWidth=Math.max(3.5,r*.26);
  ctx.beginPath();
  ctx.moveTo(-r*.40,-r*.22);
  ctx.lineTo(-r*.65-swing*r*.18,r*.10+swing*r*.2);
  ctx.moveTo(r*.40,-r*.22);
  ctx.lineTo(r*.65+swing*r*.18,r*.10-swing*r*.2);
  ctx.stroke();

  // Jersey with short sleeves.
  ctx.fillStyle=kit;
  ctx.beginPath();
  ctx.moveTo(-r*.36,-r*.48);
  ctx.lineTo(-r*.67,-r*.30);
  ctx.lineTo(-r*.49,r*.08);
  ctx.lineTo(-r*.36,r*.01);
  ctx.lineTo(-r*.38,r*.31);
  ctx.lineTo(r*.38,r*.31);
  ctx.lineTo(r*.36,r*.01);
  ctx.lineTo(r*.49,r*.08);
  ctx.lineTo(r*.67,-r*.30);
  ctx.lineTo(r*.36,-r*.48);
  ctx.lineTo(r*.20,-r*.35);
  ctx.lineTo(-r*.20,-r*.35);
  ctx.closePath();
  ctx.fill();

  // Contrasting jersey panel.
  ctx.fillStyle="#ffffff30";
  ctx.beginPath();
  ctx.moveTo(-r*.10,-r*.39);
  ctx.lineTo(r*.10,-r*.39);
  ctx.lineTo(r*.16,r*.28);
  ctx.lineTo(-r*.16,r*.28);
  ctx.closePath();
  ctx.fill();

  // Shorts.
  ctx.fillStyle=shorts;
  ctx.beginPath();
  ctx.moveTo(-r*.36,r*.27);
  ctx.lineTo(r*.36,r*.27);
  ctx.lineTo(r*.36,r*.51);
  ctx.lineTo(r*.06,r*.53);
  ctx.lineTo(0,r*.45);
  ctx.lineTo(-r*.06,r*.53);
  ctx.lineTo(-r*.36,r*.51);
  ctx.closePath();
  ctx.fill();

  // Neck and ears.
  ctx.fillStyle=skin;
  ctx.fillRect(-r*.12,-r*.59,r*.24,r*.20);
  ctx.beginPath();
  ctx.arc(-r*.30,-r*.73,r*.10,0,Math.PI*2);
  ctx.arc(r*.30,-r*.73,r*.10,0,Math.PI*2);
  ctx.fill();

  // Face.
  ctx.fillStyle=skin;
  ctx.beginPath();
  ctx.ellipse(0,-r*.76,r*.29,r*.34,0,0,Math.PI*2);
  ctx.fill();

  // Different haircuts.
  ctx.fillStyle=["#302018","#251c19","#422b22"][p.hair];
  if(p.hair===0) {
    ctx.beginPath();
    ctx.arc(0,-r*.84,r*.30,Math.PI,Math.PI*2);
    ctx.lineTo(r*.28,-r*.77);
    ctx.lineTo(-r*.28,-r*.77);
    ctx.closePath();
    ctx.fill();
  } else if(p.hair===1) {
    ctx.beginPath();
    ctx.ellipse(0,-r*.93,r*.30,r*.19,0,Math.PI,Math.PI*2);
    ctx.fill();
    ctx.fillRect(-r*.29,-r*.91,r*.12,r*.18);
  } else {
    ctx.beginPath();
    ctx.arc(0,-r*.82,r*.31,Math.PI,Math.PI*2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(-r*.17,-r*.98,r*.12,0,Math.PI*2);
    ctx.arc(r*.05,-r*1.01,r*.12,0,Math.PI*2);
    ctx.arc(r*.21,-r*.96,r*.10,0,Math.PI*2);
    ctx.fill();
  }

  // Eyes and smile.
  ctx.fillStyle="#201925";
  ctx.beginPath();
  ctx.arc(-r*.105,-r*.76,Math.max(.7,r*.035),0,Math.PI*2);
  ctx.arc(r*.105,-r*.76,Math.max(.7,r*.035),0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle="#754735";
  ctx.lineWidth=Math.max(.7,r*.045);
  ctx.beginPath();
  ctx.arc(0,-r*.67,r*.085,.15,Math.PI-.15);
  ctx.stroke();

  // Shirt number.
  ctx.fillStyle=homeTeam?"#14506a":"#70153c";
  ctx.font=`900 ${Math.max(6,r*.42)}px system-ui`;
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText(String(p.n+1),0,-r*.05);

  ctx.restore();
}

function drawBall() {
  ctx.save();
  ctx.translate(ball.x,ball.y);
  ctx.rotate(ball.spin);

  // Ball shadow.
  ctx.fillStyle="#06142c65";
  ctx.beginPath();
  ctx.ellipse(2,ball.r,ball.r*1.25,ball.r*.45,0,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#fff";
  ctx.beginPath();
  ctx.arc(0,0,ball.r*1.3,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#20263a";
  for(let i=0;i<5;i++) {
    const a=i*Math.PI*2/5;
    ctx.beginPath();
    ctx.arc(Math.cos(a)*ball.r*.52,Math.sin(a)*ball.r*.52,ball.r*.27,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function draw() {
  if(!W||!H)return;
  ctx.clearRect(0,0,W,H);
  drawField();

  // Draw players before the ball so the ball stays visible.
  players.forEach(drawPlayer);
  if(ball)drawBall();

  particles.forEach(p=>{
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life));
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
}

function loop(now) {
  if(state!=="playing")return;
  const dt=Math.min(.035,Math.max(0,(now-last)/1000));
  last=now;
  update(dt);
  draw();
  if(state==="playing")raf=requestAnimationFrame(loop);
}

// Touch, mouse and swipe controls.
canvas.addEventListener("pointerdown",e=>{
  if(state!=="playing")return;
  e.preventDefault();enableSound();
  const r=canvas.getBoundingClientRect();
  swipe={x:e.clientX-r.left,y:e.clientY-r.top};
  try{canvas.setPointerCapture(e.pointerId)}catch(err){}
});

canvas.addEventListener("pointerup",e=>{
  if(!swipe||state!=="playing")return;
  e.preventDefault();

  const r=canvas.getBoundingClientRect();
  const x=e.clientX-r.left,y=e.clientY-r.top;
  const dx=x-swipe.x,dy=y-swipe.y,d=Math.hypot(dx,dy);
  const p=selectedPlayer();

  if(d>28) {
    const angle=Math.atan2(dy,dx);
    if(d>Math.min(W,H)*.22) {
      act("shoot",angle,Math.min(1.5,d/Math.min(W,H)));
    } else if(Math.hypot(p.x-ball.x,p.y-ball.y)<p.r+ball.r+55) {
      act("pass",angle);
    } else {
      act("move",angle);
    }
  } else {
    // A tap moves the selected player; use the SHOOT button to attempt a shot.
    p.tx=x;p.ty=y;clampTarget(p);
  }
  swipe=null;
});
canvas.addEventListener("pointercancel",()=>swipe=null);

$("pass").addEventListener("pointerdown",e=>{e.preventDefault();act("pass")});
$("shoot").addEventListener("pointerdown",e=>{e.preventDefault();act("shoot")});
$("switch").addEventListener("pointerdown",e=>{e.preventDefault();act("switch")});
$("play").addEventListener("click",startGame);

// Keyboard controls.
window.addEventListener("keydown",e=>{
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))e.preventDefault();

  if(state==="title"&&e.key==="Enter"){startGame();return}
  if((state==="half"||state==="over")&&e.key==="Enter"){$("overButton").click();return}
  if(state!=="playing")return;

  const p=selectedPlayer(),s=W*.18;
  if(["ArrowUp","w","W"].includes(e.key))p.ty-=s;
  if(["ArrowDown","s","S"].includes(e.key))p.ty+=s;
  if(["ArrowLeft","a","A"].includes(e.key))p.tx-=s;
  if(["ArrowRight","d","D"].includes(e.key))p.tx+=s;
  if([" ","x","X"].includes(e.key))act("shoot");
  if(["z","Z"].includes(e.key))act("pass");
  if(e.key==="Tab"){e.preventDefault();act("switch")}
  clampTarget(p);
});

document.addEventListener("visibilitychange",()=>{
  if(document.hidden&&state==="playing") {
    state="paused";cancelAnimationFrame(raf);
  } else if(!document.hidden&&state==="paused") {
    state="playing";last=performance.now();raf=requestAnimationFrame(loop);
  }
});

// Initial screen: show the actual pitch and footballers behind the title.
resize();
setupPlayers();
draw();
bestShow();

})();
</script>
